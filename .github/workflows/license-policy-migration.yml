name: Apply license policy

on:
  push:
    branches:
      - chore/license-policy-2026-08-24

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped licenses and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LICENSES
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt \
            --output LICENSE
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/CC-BY-NC-SA-4.0.txt \
            --output LICENSES/CC-BY-NC-SA-4.0.txt

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          licensing = '''# Repository licensing

Evenward contains executable software, original educational and visual material, and third-party components. The categories below are licensed separately; this is a scoped licensing policy, not a choice between interchangeable licenses for every file.

## Software and mixed source files — MPL-2.0

Unless a file carries a more specific notice, application source, components, domain logic, hooks, tests, scripts, package manifests, build configuration, and technical files are licensed under the [Mozilla Public License 2.0](LICENSE).

A source file that combines executable code with embedded instructional text, data, or interface copy is treated as software under MPL-2.0. Modified MPL-covered files must remain available under MPL-2.0, while separate files in a larger work may use other compatible terms.

## Standalone educational and visual material — CC BY-NC-SA 4.0

Unless a file carries a more specific notice, separately published original documentation, movement studies, illustrations, diagrams, authored learning material, and other non-software creative work are licensed under the [Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License](LICENSES/CC-BY-NC-SA-4.0.txt).

This Creative Commons license does not apply to software. Commercial reuse of this separately licensed material requires separate permission. A distributor may replace those materials and use the MPL-covered software under MPL-2.0.

## Marks and source identity — reserved

The names **Evenward** and **Evenward Regulation Studio**, project domains, logos, trade dress, and other source-identifying marks are not licensed as trademarks or service marks. Accurate descriptive and nominative use permitted by law remains unaffected.

## Third-party material

Third-party libraries, fonts, icons, quotations, reference material, and other incorporated works retain their own notices and terms. Their specific notices override this repository-level map. No license is granted to material for which the licensor lacks authority.

## File-level priority

The most specific notice controls. A notice in a file or its containing directory overrides this map. Generated output follows the license of the source material from which it is produced unless the output carries a different notice.

## Contributions

By submitting a contribution, a contributor represents that they have the right to submit it and agrees to license it under the terms governing the affected material in this file. Third-party material must retain its original notices and terms.

## Effective revision

This policy applies to revisions committed on or after **August 24, 2026**. Earlier public revisions that contained no license did not grant reuse rights merely by being publicly accessible.
'''
          (root / 'LICENSING.md').write_text(licensing, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8').rstrip()
          section = '''## License

Evenward uses scoped licensing: software and mixed source files are [MPL-2.0](LICENSE), while separately published original educational and visual materials are [CC BY-NC-SA 4.0](LICENSES/CC-BY-NC-SA-4.0.txt). Project marks are reserved, and third-party materials retain their own terms. See [LICENSING.md](LICENSING.md) for the controlling file-level rules.'''
          pattern = re.compile(r'(?ms)^## License\n.*?(?=^## |\Z)')
          if pattern.search(readme):
              readme = pattern.sub(section + '\n\n', readme).rstrip()
          else:
              readme += '\n\n' + section
          readme_path.write_text(readme + '\n', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['license'] = 'MPL-2.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          lock_path = root / 'package-lock.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock.setdefault('packages', {}).setdefault('', {})['license'] = 'MPL-2.0'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY

          npm ci
          npm run check

          rm .github/workflows/license-policy-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply scoped Evenward licensing"
          git push origin HEAD:${GITHUB_REF_NAME}
